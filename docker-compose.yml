version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: alfraganus_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: rootpassword
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - '6379:6379'

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - '8000:8000'
    environment:
      - DB_NAME=alfraganus_db
      - DB_USER=admin
      - DB_PASSWORD=rootpassword
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=8637787409:AAGH7zMMS4hjTFo9rsh4ZbKPmdJP2JKIXPE # Buni almashtirasiz
    depends_on:
      - db
      - redis

  celery_worker:
    build: .
    command: celery -A config worker -l info # "core" ni o'zingizning asosiy django papkangiz nomiga almashtiring
    volumes:
      - .:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=8637787409:AAGH7zMMS4hjTFo9rsh4ZbKPmdJP2JKIXPE
      - DB_HOST=db
    depends_on:
      - web
      - redis

  celery_beat:
    build: .
    command: celery -A config beat -l info # Rejali tasklar (har kungi xabar) uchun
    volumes:
      - .:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - web
      - redis
  
  bot:
    build: .
    command: python bot/run.py
    volumes:
      - .:/app
    environment:
      - DB_NAME=alfraganus_db
      - DB_USER=admin
      - DB_PASSWORD=rootpassword
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=8637787409:AAGH7zMMS4hjTFo9rsh4ZbKPmdJP2JKIXPE
      - API_BASE_URL=http://web:8000/api
    depends_on:
      - db
      - redis
      - web

volumes:
  postgres_data:
